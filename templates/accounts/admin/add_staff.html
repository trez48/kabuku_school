{% extends 'accounts/admin_base.html' %}
{% block title %}Add Staff{% endblock %}
{% block page_title %}Add Staff Member{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Role</label>
                    <select name="role" class="form-select" required>
                        <option value="teacher">Teacher</option>
                        <option value="headmaster">Headmaster</option>
                        <option value="admin_staff">Administrative Staff</option>
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Subject</label>
                    <input type="text" name="subject" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Phone</label>
                    <input type="text" name="phone" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Photo</label>
                    <input type="file" name="photo" class="form-control" accept="image/*">
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Qualification</label>
                    <input type="text" name="qualification" class="form-control" placeholder="e.g. B.Sc Physics, M.Ed">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Experience</label>
                    <input type="text" name="experience" class="form-control" placeholder="e.g. 10 years">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">Short Biography</label>
                <textarea name="bio" class="form-control" rows="3" placeholder="Brief description about this staff member..."></textarea>
            </div>
            <hr>
            <h5>Login Account (optional)</h5>
            <p class="text-muted">Fill these to allow this staff member to login to the portal.</p>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-orange">Save</button>
            <a href="{% url 'admin_staff' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
