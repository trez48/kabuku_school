{% extends 'accounts/admin_base.html' %}
{% block title %}Add Subject{% endblock %}
{% block page_title %}Add Subject{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body p-4">
        <form method="post">
            {% csrf_token %}
            <div class="row g-3">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Subject Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Physics" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Code</label>
                    <input type="text" name="code" class="form-control" placeholder="e.g. PHY" required>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Combination</label>
                    <select name="combination" class="form-select" required>
                        {% for c in combinations %}<option value="{{ c.pk }}">{{ c.code }}</option>{% endfor %}
                    </select>
                </div>
                <div class="col-md-3 mb-3">
                    <label class="form-label">Assign Teacher</label>
                    <select name="teacher" class="form-select">
                        <option value="">-- None --</option>
                        {% for t in teachers %}<option value="{{ t.pk }}">{{ t.get_full_name }}</option>{% endfor %}
                    </select>
                </div>
            </div>
            <button type="submit" class="btn btn-orange">Add Subject</button>
            <a href="{% url 'admin_subjects' %}" class="btn btn-outline-dark ms-2">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
