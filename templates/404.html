{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Kabuku Secondary School</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root { --orange: #F57C00; --dark: #1B2A4A; }
        body { font-family: 'Inter', sans-serif; background: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-box { text-align: center; padding: 60px 30px; }
        .error-code { font-size: 8rem; font-weight: 800; color: var(--orange); line-height: 1; }
        .error-title { font-size: 1.8rem; font-weight: 700; color: var(--dark); margin: 15px 0 10px; }
        .error-text { color: #666; max-width: 400px; margin: 0 auto 30px; }
        .btn-home { background: var(--orange); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 500; text-decoration: none; display: inline-block; transition: all 0.3s; }
        .btn-home:hover { background: #E65100; color: #fff; transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <p class="error-text">The page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn-home"><i class="fas fa-home me-2"></i>Back to Home</a>
    </div>
</body>
</html>
